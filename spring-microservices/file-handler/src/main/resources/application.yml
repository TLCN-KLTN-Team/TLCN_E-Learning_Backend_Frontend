server:
  port: 8084
  servlet:
    context-path: /file-handler

spring:
  application:
    name: file-handler-service
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/file-handler-service?authSource=admin

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}