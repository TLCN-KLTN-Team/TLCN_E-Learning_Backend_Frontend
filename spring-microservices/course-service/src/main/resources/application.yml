# course-service
server:
  port: 8088
  servlet:
    context-path: /course-management
  tomcat:
    max-http-form-post-size: 104857600

spring:
  profiles:
    default: default
  task:
    scheduling:
      time-zone: Asia/Ho_Chi_Minh
  application:
    name: course-management
  doc:
    api-docs:
      enabled: true
    swagger-ui:
      csrf:
        enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: course-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}
  data:
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Configuration
jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 36000
  refreshable-duration: 36000

# Service Configuration for Service-to-Service Authentication
service:
  id: course-service

app:
  email:
    from: ${APP_EMAIL_FROM}
    from-name: ${APP_EMAIL_FROM_NAME}
  revenue:
    escrow-hold-days: ${ESCROW_HOLD_DAYS:7}
  services:
    identity: ${IDENTITY_SERVICE_URL:http://localhost:8080/identity}
    file: ${FILE_SERVICE_URL:http://localhost:8084/file-handler}
    notification: ${NOTIFICATION_SERVICE_URI:http://localhost:8092}

# Logging Configuration
logging:
  level:
    com.hoangphihiep: DEBUG
    org.springframework.web: DEBUG

# OpenAPI / Swagger
openapi:
  services:
    api-docs: api-docs
    server: ${API_GATEWAY_URL:http://localhost:8888}/api/v1${server.servlet.context-path}
    title: Course Management APIs
    version: 1.0.0
    license:
      name: Apache 2.0
      url: https://springdoc.org

# VNPay Configuration
vnpay:
  tmnCode: ${VNPAY_TMN_CODE}
  hashSecret: ${VNPAY_HASH_SECRET}
  payUrl: ${VNPAY_PAY_URL}
  returnUrl: ${VNPAY_RETURN_URL}
  apiUrl: ${VNPAY_API_URL}

# PayPal Configuration
paypal:
  client:
    id: ${PAYPAL_CLIENT_ID}
    secret: ${PAYPAL_CLIENT_SECRET}
  mode: sandbox
  return-url: ${PAYPAL_RETURN_URL}
  cancel-url: ${PAYPAL_CANCEL_URL}

# Elasticsearch custom values
elasticsearch:
  host: localhost
  port: 9200

kafka:
  topic:
    course-events: course-events
    class-events: class-events
    score-events: score-events

management:
  endpoints:
    web:
      exposure:
        include: health,info  # hoặc * nếu bạn muốn expose hết
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false  # Tắt mail health check tạm thời

# Blockchain Configuration
blockchain:
  rpc-url: ${BLOCKCHAIN_RPC_URL:http://localhost:7545}
  private-key: ${BLOCKCHAIN_PRIVATE_KEY:}
  contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:}
  chain-id: ${BLOCKCHAIN_CHAIN_ID:1337}

signature-verification:
  trusted-issuer-keywords: ${SIGNATURE_TRUSTED_ISSUERS:NEAC,VNPT,VIETTEL,FPT}
  revocation-timeout-ms: ${SIGNATURE_REVOCATION_TIMEOUT_MS:3000}
  revocation-timeout-policy: ${SIGNATURE_REVOCATION_TIMEOUT_POLICY:MANUAL_REVIEW}

pinata:
  jwt: ${PINATA_JWT}
  gateway-url: ${PINATA_GATEWAY_URL:https://gateway.pinata.cloud/ipfs/}
  api-url: ${PINATA_API_URL:https://api.pinata.cloud}