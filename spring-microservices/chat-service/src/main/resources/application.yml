spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: mongodb://root:root@mongodb:27017/mongo_notification?authSource=admin
      auto-index-creation: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# self-defined configs
openapi:
  services:
    api-docs: api-docs
    server: http://localhost:8888/api/v1${server.servlet.context-path}
    title: Chat App APIs
    version: 1.0.0
    license:
      name: Apache 2.0
      url: https://springdoc.org

jwt:
  secretKey: D0iwggWH/ZIxH2ZqhGNlJ8DtjECo2jiiDLU7Dg5bm94hjHCbS8wMK9MyJLCYJCyi

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  file:
    max-size: 10485760 # 10 MB

server:
  port: 8090
  servlet:
    context-path: /server

services:
  identity:
    url: http://localhost:8080/identity

rabbitmq:
  exchange:
    name: notification.exchange
  routing:
    key: notification.routingkey
  queue:
    edu-unit-queue: edu-unit-queue