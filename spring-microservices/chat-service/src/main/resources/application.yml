spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: mongodb://root:root@mongodb:27017/mongo_notification?authSource=admin
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: workspace-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: demo.app.chat_app.events.CourseCreatedEvent
    listener:
      ack-mode: manual

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# self-defined configs
openapi:
  services:
    api-docs: api-docs
    server: http://localhost:8888/api/v1${server.servlet.context-path}
    title: Chat App APIs
    version: 1.0.0
    license:
      name: Apache 2.0
      url: https://springdoc.org

jwt:
  secretKey: D0iwggWH/ZIxH2ZqhGNlJ8DtjECo2jiiDLU7Dg5bm94hjHCbS8wMK9MyJLCYJCyi

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  file:
    max-size: 10485760 # 10 MB

server:
  port: 8090
  servlet:
    context-path: /server

services:
  identity:
    url: http://localhost:8080/identity

kafka:
  topic:
    course-events: course-events
