server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity_service
          uri: http://localhost:8080
          predicates:
          - Path=${app.api-prefix}/identity/**
          filters:
          - StripPrefix=2
        - id: course-management
          uri: http://localhost:8088
          predicates:
            - Path=${app.api-prefix}/course-management/**
          filters:
            - StripPrefix=2
        - id: profile_service
          uri: http://localhost:8081
          predicates:
          - Path=${app.api-prefix}/profile/users/**
          filters:
          - StripPrefix=2
        # WebSocket route with Upgrade header. when the client requests a WebSocket connection, it will match this route.
        - id: chat_service_websocket
          uri: http://localhost:8090
          predicates:
            - Path=${app.api-prefix}/server/ws/**
            - Header=Upgrade,websocket
          filters:
            - StripPrefix=2
        - id: chat_service_sockjs_info
          uri: http://localhost:8090
          predicates:
            - Path=${app.api-prefix}/server/ws/info/**
          filters:
            - StripPrefix=2
        # HTTP route for chat service. This route is used for regular HTTP requests.
        - id: chat_service_http
          uri: http://localhost:8090
          predicates:
            - Path=${app.api-prefix}/server/**
          filters:
            - StripPrefix=2
