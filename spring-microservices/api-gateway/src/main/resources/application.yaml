server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            - id: identity-service
              uri: http://identity-service:8080
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2

            - id: profile-service
              uri: http://profile-service:8081
              predicates:
                - Path=${app.api-prefix}/profile/users/**
              filters:
                - StripPrefix=2

            - id: file-handler-service
              uri: http://file-service:8084
              predicates:
                - Path=${app.api-prefix}/file-handler/**
              filters:
                - StripPrefix=2

            - id: course-management-service
              uri: http://course-service:8088
              predicates:
                - Path=${app.api-prefix}/course-management/**
              filters:
                - StripPrefix=2

            # WebSocket route
            - id: chat-service-websocket
              uri: ws://chat-service:8090
              predicates:
                - Path=${app.api-prefix}/server/ws/**
                - Header=Upgrade, websocket
              filters:
                - StripPrefix=2

            # SockJS fallback
            - id: chat-service-sockjs
              uri: http://chat-service:8090
              predicates:
                - Path=${app.api-prefix}/server/ws/info/**
              filters:
                - StripPrefix=2

            # HTTP API for chat
            - id: chat-service-http
              uri: http://chat-service:8090
              predicates:
                - Path=${app.api-prefix}/server/**
              filters:
                - StripPrefix=2

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: http://identity-service:8080/identity/v3/api-docs
      - name: course-service
        url: http://course-service:8088/course-management/v3/api-docs
      - name: realtime-service
        url: http://chat-service:8090/server/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info  # hoặc "*" nếu muốn expose tất cả
  endpoint:
    health:
      show-details: always