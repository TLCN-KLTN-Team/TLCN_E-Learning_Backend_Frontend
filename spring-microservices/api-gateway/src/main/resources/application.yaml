# api-gateway
server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2

            - id: file-handler-service
              uri: ${FILE_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=${app.api-prefix}/file-handler/**
              filters:
                - StripPrefix=2

            - id: course-management-service
              uri: ${COURSE_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=${app.api-prefix}/course-management/**
              filters:
                - StripPrefix=2

            # WebSocket route
            - id: chat-service-websocket
              uri: ${CHAT_SERVICE_URI:ws://localhost:8090}
              predicates:
                - Path=${app.api-prefix}/server/ws/**
                - Header=Upgrade, websocket
              filters:
                - StripPrefix=2

            # SockJS fallback
            - id: chat-service-sockjs
              uri: ${CHAT_SERVICE_URI:http://localhost:8090}
              predicates:
                - Path=${app.api-prefix}/server/ws/info/**
              filters:
                - StripPrefix=2

            # HTTP API for chat
            - id: chat-service-http
              uri: ${CHAT_SERVICE_URI:http://localhost:8090}
              predicates:
                - Path=${app.api-prefix}/server/**
              filters:
                - StripPrefix=2

            # Forum Service (integrated in chat-service)
            - id: chat-service-forum
              uri: ${CHAT_SERVICE_URI:http://localhost:8090}
              predicates:
                - Path=${app.api-prefix}/chat/forum/**
              filters:
                - StripPrefix=3
                - PrefixPath=/server

            # Notification Service
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8092}
              predicates:
                - Path=${app.api-prefix}/notifications/**
              filters:
                - StripPrefix=2

            # AI Service
            - id: ai-service
              uri: ${AI_SERVICE_URI:http://localhost:8000}
              predicates:
                - Path=${app.api-prefix}/ai/**
              filters:
                - StripPrefix=2

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: ${IDENTITY_SERVICE_URI:http://localhost:8080}/identity/v3/api-docs
      - name: course-service
        url: ${COURSE_SERVICE_URI:http://localhost:8088}/course-management/v3/api-docs
      - name: realtime-service
        url: ${CHAT_SERVICE_URI:http://localhost:8090}/server/v3/api-docs
      - name: file-service
        url: ${FILE_SERVICE_URI:http://localhost:8084}/file-handler/v3/api-docs
      - name: ai-service
        url: ${AI_SERVICE_URI:http://localhost:8000}/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info  # hoặc "*" nếu muốn expose tất cả
  endpoint:
    health:
      show-details: always