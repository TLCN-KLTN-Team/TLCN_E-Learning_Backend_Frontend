# file-service
server:
  port: 8084
  servlet:
    context-path: /file-handler

spring:
  application:
    name: file-handler-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/file-handler-service}
  servlet:
    multipart:
      max-file-size: 20MB # 20MB = 2 * 10 * 1024 * 1024 bytes
      max-request-size: 200MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info  # hoặc * nếu bạn muốn expose hết
  endpoint:
    health:
      show-details: always